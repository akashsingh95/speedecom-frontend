services:
  client:
    build:
      context: .
      args:
        - VITE_PAYMENT_OFFSET=${VITE_PAYMENT_OFFSET:-0}
        - VITE_PAYMENT_MULTIPLIER=${VITE_PAYMENT_MULTIPLIER:-1}
    image: speedecom-client:local
    container_name: speed-ecom-client-local
    ports:
      - "3000:80"
    command: sh -c "sed -i 's/^[[:space:]]*worker_processes.*/worker_processes ${CLIENT_WORKERS:-1};/g' /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: on-failure

# The backend stack creates this network; start it first so nginx can resolve `server`.
networks:
  default:
    name: speedecom-net
    external: true
