server {
    listen 80;
    
    root /usr/share/nginx/html;
    index index.html;

    location /client/ {
        try_files $uri $uri/ /client/index.html;
    }

    # Listing Studio's LLM/image-generation calls can legitimately run several minutes — matched
    # before the general /api/ block below (nginx picks the longest matching prefix), so only
    # these calls get a longer wait; every other API route keeps nginx's 60s default, so a slow
    # request elsewhere still surfaces as a timeout instead of silently hanging.
    location /api/listing-studio/ {
        proxy_pass http://server:5000;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    location /api/ {
        proxy_pass http://server:5000;
    }

    location /dashboard/ {
        proxy_pass http://server:5000;
    }
}
